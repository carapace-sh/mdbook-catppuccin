name: Rust

on:
  pull_request:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: shallow clone
      uses: actions/checkout@v4
      if: "!startsWith(github.ref, 'refs/tags/')"

    - name: deep clone
      uses: actions/checkout@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        fetch-depth: 0

    - name: Set version by tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        sed -i "s_0.0.0-PLACEHOLDER_${GITHUB_REF/refs\/tags\/v/}_" Cargo.toml Cargo.lock
        git update-index --assume-unchanged Cargo.toml Cargo.lock

    - name: Add musl target
      run: rustup target add x86_64-unknown-linux-musl

    - name: Build
      run: cargo build --target x86_64-unknown-linux-musl --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      if: startsWith(github.ref, 'refs/tags/')
      with:
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
